name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Load test scenario'
        type: choice
        required: true
        default: 'smoke'
        options: [smoke, load, stress, soak]
      base_url:
        description: 'Target API base URL'
        type: string
        required: true
        default: 'https://yorecebimde-staging.gkteches.com/api'

jobs:
  k6:
    runs-on: ubuntu-latest
    # soak için 24h limit, diğerleri için 1h
    timeout-minutes: ${{ github.event.inputs.scenario == 'soak' && 1500 || 60 }}

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install k6

      - name: Pre-test notification
        run: |
          echo "::notice::Starting ${{ github.event.inputs.scenario }} test against ${{ github.event.inputs.base_url }}"

      - name: Run k6 ${{ github.event.inputs.scenario }}
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          k6 run \
            --summary-export=summary.json \
            --out json=raw-results.json \
            tests/load/${{ github.event.inputs.scenario }}.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ github.event.inputs.scenario }}-${{ github.run_id }}
          path: |
            summary.json
            raw-results.json
          retention-days: 30
