name: E2E (Playwright)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yorecebimde
          POSTGRES_PASSWORD: yorecebimde
          POSTGRES_DB: yorecebimde_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yorecebimde:yorecebimde@localhost:5432/yorecebimde_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      BETTER_AUTH_SECRET: e2e-secret-key-only-for-ci-do-not-use-in-prod-32+
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      LOG_LEVEL: warn
      LOG_PRETTY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: DB migrate
        run: pnpm -F @yorecebimde/db migrate

      - name: DB seed
        run: pnpm -F @yorecebimde/db seed
        continue-on-error: true

      - name: Build API + Web
        run: |
          pnpm -F @yorecebimde/api build || true
          pnpm -F @yorecebimde/web build

      - name: Start API
        run: pnpm -F @yorecebimde/api start &
        env:
          PORT: 4000

      - name: Start Web
        run: pnpm -F @yorecebimde/web start &
        env:
          PORT: 3000

      - name: Wait for services
        run: |
          npx wait-on http://localhost:4000/healthz --timeout 60000
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        run: pnpm -F @yorecebimde/e2e-tests exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm -F @yorecebimde/e2e-tests test
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
