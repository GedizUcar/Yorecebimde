name: Deploy to staging

# Migrations are NOT auto-applied. When a new migration ships, SSH into the
# VPS and run it manually (drizzle migrate script needs tsx — not in runtime
# image). Track this as tech-debt: add a migrate service in compose.staging.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build, restart
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" bash -lc "'
            set -euo pipefail
            cd \"$DEPLOY_PATH\"
            echo \"[deploy] fetching origin/main\"
            git fetch --prune origin
            git reset --hard origin/main
            echo \"[deploy] building + restarting api+web\"
            cd infra/docker
            docker compose -f compose.staging.yml --env-file ../../.env.staging up -d --build yorecebimde-api yorecebimde-web
            echo \"[deploy] pruning dangling images\"
            docker image prune -f
          '"

      - name: Smoke test
        env:
          BASE: https://yorecebimde-staging.gkteches.com
        run: |
          set -e
          echo "[smoke] homepage"
          curl -fsSL -o /dev/null -w "  %{http_code} %{size_download}b\n" "$BASE/"
          echo "[smoke] api products"
          curl -fsSL -o /dev/null -w "  %{http_code}\n" "$BASE/v1/products?limit=1"
          echo "[smoke] swagger"
          curl -fsSL -o /dev/null -w "  %{http_code}\n" "$BASE/v1/docs"
