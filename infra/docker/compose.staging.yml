# ===================================================================
# Yörecebimde — Staging stack
# ===================================================================
# - Host port expose YOK (orkestra-nginx tek 80/443 sahibidir)
# - docker_orkestra external network (mevcut paylaşılan)
# - Yörecebimde'ye özel internal network (Postgres/Redis/Meilisearch izolasyonu)
# - Volume isimleri yorecebimde_* prefix
# Repository: /opt/yorecebimde
# ===================================================================

name: yorecebimde

networks:
  docker_orkestra:
    external: true
  yorecebimde_internal:
    internal: true

volumes:
  yorecebimde_postgres_data:
  yorecebimde_redis_data:
  yorecebimde_minio_data:
  yorecebimde_meilisearch_data:

services:
  # ─── Database ──────────────────────────────────────────────
  yorecebimde-postgres:
    image: postgres:16-alpine
    container_name: yorecebimde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yorecebimde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-yorecebimde}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    networks: [yorecebimde_internal]
    volumes:
      - yorecebimde_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────────
  yorecebimde-redis:
    image: redis:7-alpine
    container_name: yorecebimde-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --save 60 1 --maxmemory 1gb --maxmemory-policy allkeys-lru"]
    networks: [yorecebimde_internal]
    volumes:
      - yorecebimde_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Search (Meilisearch) ──────────────────────────────────
  yorecebimde-meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: yorecebimde-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:?required}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    networks: [yorecebimde_internal]
    volumes:
      - yorecebimde_meilisearch_data:/meili_data

  # ─── Object Storage (MinIO) ────────────────────────────────
  yorecebimde-minio:
    image: minio/minio:latest
    container_name: yorecebimde-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_PUBLIC_URL}
    networks:
      yorecebimde_internal:
      docker_orkestra:
        aliases:
          - yorecebimde-minio
    volumes:
      - yorecebimde_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  yorecebimde-minio-init:
    image: minio/mc:latest
    container_name: yorecebimde-minio-init
    networks: [yorecebimde_internal]
    depends_on:
      yorecebimde-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://yorecebimde-minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb -p local/products || true;
      mc mb -p local/seller-documents || true;
      mc mb -p local/invoices || true;
      mc mb -p local/chat-attachments || true;
      mc mb -p local/disputes || true;
      mc mb -p local/backups || true;
      mc anonymous set download local/products || true;
      echo 'MinIO buckets ready';
      "
    restart: "no"

  # ─── NestJS API ────────────────────────────────────────────
  yorecebimde-api:
    image: yorecebimde-api:staging
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: yorecebimde-api
    restart: unless-stopped
    env_file: ../../.env.staging
    networks:
      yorecebimde_internal:
      docker_orkestra:
        aliases:
          - yorecebimde-api
    depends_on:
      yorecebimde-postgres:
        condition: service_healthy
      yorecebimde-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ─── Next.js Web ───────────────────────────────────────────
  yorecebimde-web:
    image: yorecebimde-web:staging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?required}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:?required}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:?required}
        NEXT_PUBLIC_DEFAULT_LOCALE: tr
        NEXT_PUBLIC_SUPPORTED_LOCALES: tr,en
    container_name: yorecebimde-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server Component'lar → Docker network içinden CF bypass + faster
      INTERNAL_API_URL: http://yorecebimde-api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?required}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:?required}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:?required}
      NEXT_PUBLIC_DEFAULT_LOCALE: tr
      NEXT_PUBLIC_SUPPORTED_LOCALES: tr,en
    networks:
      docker_orkestra:
        aliases:
          - yorecebimde-web
    depends_on:
      - yorecebimde-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
