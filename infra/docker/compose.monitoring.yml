# ==================================================================
# Yörecebimde — Monitoring Stack (ayrı compose, opsiyonel başlatılır)
# ==================================================================
# - Grafana — dashboard'lar (Prometheus, Loki, k6 datasource)
# - Prometheus — metric scrape + alert rule
# - Loki — log aggregation (pino structured logs)
# - Promtail — log shipper Docker → Loki
# - Uptime Kuma — public status page + health monitor
# - cAdvisor — container resource metrics
# - node-exporter — host metrics
# - alertmanager — Prometheus alert routing (Telegram/email)
#
# Sentry self-host AYRI compose (resmi getsentry/self-hosted repo'su kullan).
# Bu stack ile orchestre etmek mümkün ama scope dışı.
#
# Başlatma:
#   docker compose -f infra/docker/compose.monitoring.yml up -d
#
# Erişim (nginx reverse proxy ile public domain):
#   grafana.yorecebimde-staging.gkteches.com
#   uptime.yorecebimde-staging.gkteches.com
# ==================================================================

name: yorecebimde-monitoring

networks:
  monitoring:
    driver: bridge
  yorecebimde_internal:
    external: true # ana stack network'üne bağlan (Prometheus scrape için)

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  uptime_kuma_data:
  alertmanager_data:

services:
  # ─── Grafana ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: yorecebimde-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3001}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on: [prometheus, loki]

  # ─── Prometheus ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: yorecebimde-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [monitoring, yorecebimde_internal]

  # ─── Loki ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.0
    container_name: yorecebimde-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]

  # ─── Promtail (log shipper) ──────────────────────────────────────
  promtail:
    image: grafana/promtail:3.3.0
    container_name: yorecebimde-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [monitoring]
    depends_on: [loki]

  # ─── Uptime Kuma ─────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: yorecebimde-uptime
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks: [monitoring]
    # Public status page Cloudflare proxy üzerinden expose edilir

  # ─── cAdvisor ────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: yorecebimde-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  # ─── node-exporter ───────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: yorecebimde-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter:/var/lib/node_exporter:ro
    networks: [monitoring]

  # ─── Alertmanager ────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: yorecebimde-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]
