global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'telegram-critical'
      group_wait: 10s
      continue: true

    - match:
        severity: warning
      receiver: 'telegram-warning'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://yorecebimde-api:4000/v1/internal/alert-webhook'
        send_resolved: true

  - name: 'telegram-critical'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CRITICAL_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          🚨 <b>[CRITICAL]</b> {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: 'telegram-warning'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_WARNING_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          ⚠ [warn] {{ .GroupLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']
