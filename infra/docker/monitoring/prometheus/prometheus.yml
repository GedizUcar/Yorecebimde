global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: yorecebimde-staging

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Self
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Yörecebimde API (custom metrics)
  - job_name: yorecebimde-api
    metrics_path: /metrics
    static_configs:
      - targets: ['yorecebimde-api:4000']
        labels:
          service: api

  # Container metrics
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Host metrics
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Postgres exporter (Faz 8'de eklenir — postgres_exporter container)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
